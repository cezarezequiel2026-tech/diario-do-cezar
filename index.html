<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dceeff"><link rel="manifest" href="manifest.json"><title>Diário do Cézar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f9fd;color:#18344a;font:16px system-ui}header{padding:22px;background:linear-gradient(140deg,#dceeff,#fff)}h1{margin:0;font-size:25px}main{max-width:680px;margin:auto;padding:14px}.card{background:white;border:1px solid #d8e7f2;border-radius:18px;padding:15px;margin-bottom:14px}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#24679b;color:white;font-weight:650}.quick{min-height:86px;background:#e8f4ff;color:#18344a;border:1px solid #c6e1f7}.quick span{display:block;font-size:24px}input,select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #cbdbe7;border-radius:10px;font:inherit}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.secondary{background:#eef5fa;color:#18344a}.entry{display:flex;gap:10px;align-items:center;border-bottom:1px solid #d8e7f2;padding:10px 0}.details{flex:1}.details small,.sub,.status{color:#617789;font-size:13px}.danger{background:#fff0ef;color:#b42318;padding:8px}.hidden{display:none!important}@media(min-width:540px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>🩵 Diário do Cézar</h1><p class="sub">Um diário de cuidados para a família</p></header><main>
<section id="auth" class="card"><h2>Entrar no Diário</h2><p class="sub">Use a conta cadastrada no Firebase Authentication.</p><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button id="login">Entrar</button><button id="register" class="secondary">Criar conta</button></div><p id="authMsg" class="status"></p></section>
<section id="app" class="hidden"><div class="card"><h2>Registrar cuidado</h2><p class="sub">Um toque depois do cuidado. Hora automática.</p><div class="grid"><button class="quick" data-type="Peito"><span>🤱</span>Mamou no peito<small>Registrar agora</small></button><button class="quick" data-type="Mamadeira"><span>🍼</span>Mamadeira<small>Informar ml</small></button><button class="quick" data-type="Fralda"><span>🧷</span>Fralda trocada<small>Registrar agora</small></button><button class="quick" data-type="Cocô"><span>💩</span>Fez cocô<small>Registrar agora</small></button></div><p id="sync" class="status">Sincronizando…</p></div>
<div class="card"><h2>Próxima mamada</h2><label>Horário planejado</label><input id="nextFeed" type="datetime-local"><button id="saveNext" class="secondary">Salvar horário compartilhado</button><p id="nextMsg" class="status"></p></div>
<div class="card"><h2>Peso e crescimento</h2><div class="row"><div><label>Peso (kg)</label><input id="weight" type="number" step=".001" placeholder="5,700"></div><div><label>Comprimento (cm)</label><input id="length" type="number" step=".1" placeholder="58"></div></div><button id="saveGrowth" class="secondary">Registrar medidas</button></div>
<div class="card"><h2>Histórico</h2><div class="row"><input id="dayFilter" type="date"><select id="typeFilter"><option value="">Todos</option><option>Peito</option><option>Mamadeira</option><option>Fralda</option><option>Cocô</option><option>Crescimento</option></select></div><div id="history"><p class="status">Carregando…</p></div></div><button id="logout" class="secondary">Sair</button> <button id="install" class="secondary" hidden>Instalar aplicativo</button></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,query,orderBy,onSnapshot,serverTimestamp,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Firebase Console > Configurações do projeto > Geral > Seus apps > Web app
const firebaseConfig={apiKey:AIzaSyBLE9MmzoDNvFihelnJ4NhAhgnMuWGXNX0,authDomain: diario-do-cezar.firebaseapp.com,projectId:diario-do-cezar,storageBucket: diario-do-cezar.firebasestorage.app,messagingSenderId:401582006460,appId: 1:401582006460:web:87b0d5db63eb1e9fae70b9};
const configured=!Object.values(firebaseConfig).some(v=>String(v).startsWith("COLE_AQUI"));
const $=s=>document.querySelector(s);let auth,db,user=null,unsub=null,records=[];
function err(e){return({"auth/invalid-credential":"E-mail ou senha incorretos.","auth/email-already-in-use":"Este e-mail já está cadastrado.","auth/weak-password":"Use uma senha com pelo menos 6 caracteres.","permission-denied":"Acesso negado pelas regras do Firestore."})[e.code]||e.message}
if(configured){const a=initializeApp(firebaseConfig);auth=getAuth(a);db=getFirestore(a)}else{$('#authMsg').textContent="Falta conectar a configuração Web do seu Firebase neste arquivo.";$('#login').disabled=$('#register').disabled=true}
$('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}catch(e){$('#authMsg').textContent=err(e)}};
$('#register').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);$('#authMsg').textContent="Conta criada. Ela precisa estar autorizada nas regras do Firestore."}catch(e){$('#authMsg').textContent=err(e)}};
$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{user=u;$('#auth').classList.toggle('hidden',!!u);$('#app').classList.toggle('hidden',!u);if(unsub)unsub();if(!u)return;unsub=onSnapshot(query(collection(db,'sharedRecords'),orderBy('createdAt','desc')),s=>{records=s.docs.map(d=>({id:d.id,...d.data()}));$('#sync').textContent='Sincronizado';render()},e=>$('#sync').textContent=err(e));loadNext()});
async function add(type,extra={}){try{await addDoc(collection(db,'sharedRecords'),{type,...extra,createdAt:serverTimestamp(),createdBy:user.uid})}catch(e){alert(err(e))}}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=async()=>{let t=b.dataset.type;if(t==='Mamadeira'){let x=prompt('Quantidade em ml? Deixe vazio se preferir registrar sem quantidade.');if(x===null)return;let ml=x.trim()?Number(x.replace(',','.')):null;if(ml!==null&&(!Number.isFinite(ml)||ml<=0)){alert('Quantidade inválida.');return}await add(t,ml===null?{}:{ml})}else await add(t)});
function time(v){let d=v?.toDate?v.toDate():new Date();return d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function render(){let day=$('#dayFilter').value,typ=$('#typeFilter').value;let list=records.filter(r=>{let d=r.createdAt?.toDate?r.createdAt.toDate():new Date();return(!day||d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')===day)&&(!typ||r.type===typ)});let root=$('#history');root.innerHTML='';if(!list.length){root.textContent='Nenhum registro para esse filtro.';return}list.forEach(r=>{let e=document.createElement('div');e.className='entry';let d=document.createElement('div');d.className='details';let b=document.createElement('strong');b.textContent=({'Peito':'🤱','Mamadeira':'🍼','Fralda':'🧷','Cocô':'💩','Crescimento':'📈'}[r.type]||'🩵')+' '+r.type+(r.ml?' · '+r.ml+' ml':'')+(r.weight?' · '+r.weight+' kg':'')+(r.length?' · '+r.length+' cm':'');let s=document.createElement('small');s.textContent=time(r.createdAt);d.append(b,s);let del=document.createElement('button');del.className='danger';del.textContent='Apagar';del.onclick=async()=>{if(confirm('Apagar este registro?'))try{await deleteDoc(doc(db,'sharedRecords',r.id))}catch(e){alert(err(e))}};e.append(d,del);root.append(e)})}
$('#dayFilter').onchange=render;$('#typeFilter').onchange=render;
async function loadNext(){try{let s=await getDoc(doc(db,'appSettings','shared'));if(s.exists())$('#nextFeed').value=s.data().nextFeed||''}catch(e){}}
$('#saveNext').onclick=async()=>{if(!$('#nextFeed').value)return alert('Escolha data e horário.');try{await setDoc(doc(db,'appSettings','shared'),{nextFeed:$('#nextFeed').value,updatedAt:serverTimestamp(),updatedBy:user.uid},{merge:true});$('#nextMsg').textContent='Horário compartilhado salvo.'}catch(e){$('#nextMsg').textContent=err(e)}};
$('#saveGrowth').onclick=async()=>{let w=$('#weight').value.replace(',','.'),l=$('#length').value.replace(',','.');if(!w&&!l)return alert('Informe peso ou comprimento.');await add('Crescimento',{...(w?{weight:Number(w)}:{}),...(l?{length:Number(l)}:{})});$('#weight').value='';$('#length').value=''};
let installPrompt;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else alert('No Chrome Android, abra ⋮ e escolha Instalar app ou Adicionar à tela inicial.')};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
